version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: "increase"
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 drops the AMD/outFile build that bundles src/index
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
