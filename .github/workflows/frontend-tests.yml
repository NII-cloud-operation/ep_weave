# Publicly credit Sauce Labs because they generously support open source
# projects.
name: Frontend Tests

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      -
        name: Check out Etherpad core
        uses: actions/checkout@v6
        with:
          repository: ether/etherpad-lite
          path: etherpad-lite
      - uses: actions/setup-node@v7
        name: Install Node.js
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Checkout plugin repository
        uses: actions/checkout@v6
        with:
          path: plugin
      - name: Build plugin
        working-directory: ./plugin
        run: |
          pnpm i --no-frozen-lockfile
          pnpm run build
      -
        name: Install Etherpad core dependencies
        working-directory: ./etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path ../../plugin
      - name: Prepare ep_search
        run: |
          git clone -b feature/search-engine https://github.com/NII-cloud-operation/ep_search.git /tmp/ep_search
      - name: Install ep_search
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path /tmp/ep_search
      - name: Create settings.json
        working-directory: ./etherpad-lite
        run: cp ./src/tests/settings.json settings.json
      - name: Run the frontend tests
        working-directory: ./etherpad-lite
        shell: bash
        run: |
          pnpm run dev &
          connected=false
          can_connect() {
            curl -sSfo /dev/null http://localhost:9001/ || return 1
            connected=true
          }
          now() { date +%s; }
          start=$(now)
          while [ $(($(now) - $start)) -le 30 ] && ! can_connect; do
            sleep 1
          done
          cd src
          pnpm exec playwright install chromium --with-deps
          # Excluded tests are Etherpad core tests that are incompatible with
          # ep_weave's UI changes (see https://github.com/NII-cloud-operation/ep_weave):
          # - "the share link is the actual pad url": ep_weave rewrites pad URLs to title-based /t/ URLs
          # - "is an iframe with the correct url parameters and correct size": same reason as above
          # - "https://etherpad.org/#foo": link insertion behavior differs due to ep_weave's hashview
          # - "toolbar <li>/<a> wrappers are presentational": ep_weave adds custom toolbar buttons
          # - "settings popup stays scrollable when the viewport is short": ep_weave modifies pad UI layout
          # - "Pad-wide font dropdown opens visibly when popup is scrolled to bottom": same reason as above
          # - "share link encodes special characters in pad name": ep_weave rewrites pad URLs to title-based /t/ URLs
          # - "should display correctly encoded URLs for recent pads": ep_weave replaces the index page and hides the recent pads list
          pnpm run test-ui --project=chromium --grep-invert="the share link is the actual pad url|is an iframe with the correct url parameters and correct size|https://etherpad\.org/#foo|toolbar <li>/<a> wrappers are presentational|settings popup stays scrollable when the viewport is short|Pad-wide font dropdown opens visibly when popup is scrolled to bottom|share link encodes special characters in pad name|should display correctly encoded URLs for recent pads"
