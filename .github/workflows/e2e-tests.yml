name: E2E Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  notebook-e2e:
    name: E2E Tests ${{ matrix.nbsearch && 'with nbsearch' || 'without nbsearch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nbsearch: [false, true]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.nbsearch && 'recursive' || 'false' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Install Playwright browsers
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps

      - name: Set docker compose configuration
        run: |
          set -euxo pipefail
          if [ "${{ matrix.nbsearch }}" = "true" ]; then
            echo "COMPOSE_FILES=-f docker-compose.yml -f docker-compose.nbsearch.yml -f tests/e2e/docker-compose.nbsearch-override.yml" >> $GITHUB_ENV
            echo "E2E_EXCLUDE_NOTEBOOKS=" >> $GITHUB_ENV
            echo "NOTEBOOK7_URL=http://localhost:8888/tree?token=test-token" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILES=-f docker-compose.yml" >> $GITHUB_ENV
            echo "E2E_EXCLUDE_NOTEBOOKS=04_NBSearch_Integration.ipynb" >> $GITHUB_ENV
          fi

      - name: Build Docker images
        run: |
          set -euxo pipefail
          docker compose $COMPOSE_FILES build

      - name: Start services
        run: |
          set -euxo pipefail
          docker compose $COMPOSE_FILES up -d

      - name: Wait for services
        run: |
          set -euxo pipefail
          tests/e2e/scripts/wait-for-services.sh

      - name: Run notebook E2E tests
        env:
          E2E_TRANSITION_TIMEOUT: '30000'
        run: |
          set -euxo pipefail
          python tests/e2e/run_notebooks.py

      - name: Gather Docker logs
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p tests/e2e/artifacts
          docker compose $COMPOSE_FILES logs --no-color > tests/e2e/artifacts/docker-compose.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.nbsearch && 'with-nbsearch' || 'without-nbsearch' }}
          path: |
            tests/e2e/artifacts

      - name: Shutdown services
        if: always()
        run: |
          set -euxo pipefail
          docker compose $COMPOSE_FILES down -v

  solr-migration:
    name: Solr Volume Migration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Install Playwright browsers
        run: |
          set -euxo pipefail
          python -m playwright install --with-deps

      - name: Run migration test
        run: |
          set -euxo pipefail
          tests/e2e/migration/run.sh

      - name: Gather Docker logs
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p tests/e2e/artifacts
          docker compose logs --no-color > tests/e2e/artifacts/docker-compose.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-solr-migration
          path: |
            tests/e2e/artifacts

      - name: Shutdown services
        if: always()
        run: |
          set -euxo pipefail
          docker compose down -v
